<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helium Calculator</title>
</head>
<body>

  <main>
    <h1>Helium Calculator</h1>
    <div class = "Input-side">
      <h2>Input</h2>
      <div class = "Input-fields">
        <label for="balloon_size">Balloon Size (grams):</label>
        <input type="number"
         id="balloon_size" 
         placeholder="Balloon Size (grams)"
         min = "0"
         required 
         />



        <label for="payload-weights">Payload Weights (grams):</label>
        <input type="number"
         id="payload_weights" 
         placeholder="payload weights (grams)" 
         min = "0"
         required 
         />

         
        <label for="positive-lift">Positive Lift (grams):</label>
        <input type="number" id="positive-lift" 
        placeholder="Positive Lift (grams)" 
        min = "0"
        required 
        />

      </div>

      <div class = "Input-buttons">
        <button id="calculate-button">Calculate</button>
        <button id="reset-button">Reset</button>
      </div>

      <div class = "Output-side">
        <h2>Output</h2>
        <div class = "Output-fields">
          <label for="required-helium-volume">Required Helium (cubic feet):</label>
          <input type="number" id="helium-volume" placeholder="Helium Volume (liters)" readonly />

          <label for="est-burst-alt">Estimated Burst Altitude (meters):</label>
          <input type="number" id="est-burst-alt" placeholder="Estimated Burst Altitude (meters)" readonly />

          <label for="avg-ascent-rate">Average Ascent Rate (m/s):</label>
          <input type="number" id="avg-ascent-rate" placeholder="Average Ascent Rate (m/s)" readonly />

          <label for="ascent-time">Ascent Time (minutes):</label>
          <input type="number" id="ascent-time" placeholder="Ascent Time (minutes)" readonly />
        </div>
      </div>
    </div>
</body>
</html>
