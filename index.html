<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helium Calculator</title>
</head>
<body>

  <main>
    <h1>Helium Calculator</h1>
    <div class = "Input-side">
      <h2>Input</h2>
      <div class = "Input-fields">
        <label for="balloon_size">Balloon Size (grams):</label>
        <input type="number"
         id="balloon_size" 
         placeholder="Balloon Size (grams)"
         min = "0"
         required 
         />



        <label for="payload-weights">Payload Weights (grams):</label>
        <input type="number"
         id="payload_weights" 
         placeholder="payload weights (grams)" 
         min = "0"
         required 
         />

         
        <label for="positive-lift">Positive Lift (grams):</label>
        <input type="number" id="positive-lift" 
        placeholder="Positive Lift (grams)" 
        min = "0"
        required 
        />

      </div>

      <div class = "Input-buttons">
        <button id="calculate-button">Calculate</button>
        <button id="reset-button">Reset</button>
      </div>

      <div class = "Output-side">
        <h2>Output</h2>
        <div class = "Output-fields">
          <p>Required Helium (cubic feet): <span id="required-helium"></span></p>
          <p>Estimated Burst Altitude (meters): <span id="est-burst-alt"></span></p>
          <p>Average Ascent Rate (m/s): <span id="avg-ascent-rate"></span></p>
          <p>Ascent Time (minutes): <span id="ascent-time"></span></p>
        </div>
      </div>
    </div>
    <script type="module" src="./script/main.js"></script>
</body>
</html>
